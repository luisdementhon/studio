# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 2

# Les valeurs sensibles ne sont JAMAIS écrites ici : ce fichier est versionné
# dans git. Elles vivent dans Cloud Secret Manager et sont référencées via la
# clé `secret:` (voir README / commandes firebase apphosting:secrets:set).
#
# Seules restent en clair les valeurs publiques par nature : un identifiant
# client et une clé publiable, qui sont de toute façon exposés au navigateur
# ou à l'API partenaire.
env:
  # Identifiant client Bridge : identifiant, pas secret. À mettre à jour lors
  # du passage des identifiants sandbox aux identifiants de production.
  - variable: BRIDGE_CLIENT_ID
    value: "sandbox_id_eb1eb747f61541d68c1f7775ed91278b"

  # Clé publiable Stripe : publique par conception, inlinée dans le bundle.
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: "pk_test_51RsLWg2cs2Ko36FftJwT81VPAZxncV7yeemplfpB720nRZX7BCYqGV4WPTDNhoEXmk3MAP8k8mHshIJUoIHlndT1002U0hYvwk"

  # --- Secrets (Cloud Secret Manager) ---

  - variable: BRIDGE_CLIENT_SECRET
    secret: BRIDGE_CLIENT_SECRET

  # Signature des webhooks Bridge. Sans lui, /api/bridge/webhook rejette tout.
  - variable: BRIDGE_WEBHOOK_SECRET
    secret: BRIDGE_WEBHOOK_SECRET

  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY

  # Signature des webhooks Stripe. Sans lui, /api/stripe/webhook répond 500
  # et aucun don n'est enregistré.
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
